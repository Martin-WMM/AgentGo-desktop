name: Bug report
description: Report a reproducible problem in AgentGo Desktop
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: "0.1.0, Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
