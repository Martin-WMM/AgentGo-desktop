name: Package Desktop

on:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            target: linux
          - platform: macos
            os: macos-14
            target: mac
          - platform: windows
            os: windows-2022
            target: win
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm build:${{ matrix.target }}
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: agentgo-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
